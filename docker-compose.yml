services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eid-sqlserver
    restart: unless-stopped
    environment:
      SA_PASSWORD: ${SQLSERVER_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -C"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: eid-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 60s

volumes:
  sqlserver-data:
  oracle-data:
